<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חוג ציור | חגית אבידן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@500;700;800&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft:#F1E8D2;
    --kraft-d:#E7DABA;
    --paper:#FBF5EA;
    --ink:#2B2438;
    --turquoise:#1FB6A6;
    --turquoise-d:#128C7E;
    --coral:#FF6B5E;
    --coral-d:#E14E42;
    --sun:#FFB627;
    --violet:#7A5FE0;
    --violet-d:#5E44C4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#DCD5C6;
    display:flex;
    justify-content:center;
    padding:44px 16px;
    font-family:'Heebo', sans-serif;
  }
  .board{
    position:relative;
    width:900px;
    max-width:100%;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.10), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(0,0,0,0.08), transparent 45%),
      repeating-linear-gradient(115deg, rgba(0,0,0,0.025) 0 2px, transparent 2px 6px),
      var(--kraft);
    box-shadow:0 30px 90px rgba(0,0,0,0.45), inset 0 0 120px rgba(0,0,0,0.18);
    border-radius:4px;
    padding:56px 50px 46px;
    overflow:hidden;
  }
  .board::after{
    content:"";
    position:absolute; inset:0;
    box-shadow:inset 0 0 0 14px var(--kraft-d);
    pointer-events:none;
  }
  .layer{position:relative; z-index:2;}
  .tape{
    position:absolute;
    height:30px;
    opacity:0.85;
    box-shadow:0 2px 5px rgba(0,0,0,0.15);
  }
  .tape-stripe{
    background:repeating-linear-gradient(45deg, rgba(255,255,255,0.35) 0 6px, transparent 6px 12px);
  }
  .brand{text-align:center; margin-bottom:26px; position:relative;}
  .brand-name{font-family:'Rubik', sans-serif; font-weight:800; font-size:24px; color:var(--ink);}
  .brand-sub{font-size:12px; letter-spacing:3px; color:var(--violet-d); font-weight:500; margin-top:4px;}
  .hero-card{
    background:var(--paper);
    border-radius:6px;
    padding:36px 30px 30px;
    text-align:center;
    transform:rotate(-1.2deg);
    box-shadow:0 14px 28px rgba(0,0,0,0.22);
    position:relative;
    margin-bottom:52px;
  }
  .pin{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width:22px; height:22px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--coral) 55%, var(--coral-d) 100%);
    box-shadow:0 3px 5px rgba(0,0,0,0.35);
    z-index:3;
  }
  .hero-title{
    font-family:'Suez One', serif;
    font-weight:400;
    font-size:72px;
    line-height:1.05;
    color:var(--turquoise);
    letter-spacing:0.5px;
  }
  .hero-tag{
    font-family:'Heebo', sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--ink);
    max-width:440px;
    margin:16px auto 0;
    line-height:1.6;
    position:relative;
    display:inline-block;
  }
  .hero-tag svg{position:absolute; bottom:-10px; right:0; width:100%; height:14px;}
  .about{
    text-align:center;
    max-width:480px;
    margin:20px auto 0;
    font-size:14.5px;
    line-height:1.8;
    color:#4A4256;
  }
  .about b{color:var(--ink);}
  .section-label{
    display:inline-block;
    font-family:'Rubik', sans-serif;
    font-weight:700;
    font-size:18px;
    color:#fff;
    background:var(--ink);
    padding:8px 22px;
    border-radius:20px;
    transform:rotate(-1deg);
    margin:0 auto 26px;
  }
  .section-wrap{text-align:center;}
  .trial-banner{
    max-width:480px;
    margin:0 auto 40px;
    background:linear-gradient(135deg, var(--sun), #FFC94D);
    color:var(--ink);
    text-align:center;
    padding:16px 22px;
    border-radius:10px;
    transform:rotate(1deg);
    box-shadow:0 10px 20px rgba(0,0,0,0.18);
    font-weight:700;
    font-size:15px;
    line-height:1.6;
    position:relative;
  }
  .trial-banner .pin{background:radial-gradient(circle at 35% 30%, #fff, var(--coral) 55%, var(--coral-d) 100%);}
  .trial-banner b{font-size:16.5px;}
  .groups{display:flex; gap:22px; margin-bottom:14px; padding-top:10px;}
  .note{
    flex:1;
    background:var(--paper);
    border-radius:4px;
    padding:22px 14px 18px;
    text-align:center;
    box-shadow:0 10px 22px rgba(0,0,0,0.22);
    position:relative;
  }
